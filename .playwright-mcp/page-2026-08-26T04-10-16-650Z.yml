      - generic [ref=f3e85]:
        - generic [ref=f3e86]: Section 2 · The computational bottleneck
        - heading "One evaluation is a coupled PDE solve. The whole budget is 56 of them." [level=2] [ref=f3e87]
        - generic [ref=f3e88]:
          - generic [ref=f3e89]:
            - heading "Each call is expensive." [level=3] [ref=f3e90]
            - paragraph [ref=f3e91]: A single protocol evaluation runs an SPMe-based electrochemical model coupled to a thermal model, then accumulates the degradation proxy along the time trajectory. A typical cycle costs seconds-to-minutes on a workstation — small per call, huge at 56 calls per seed across five seeds across two batteries.
            - heading "The surrogate changes the game." [level=3] [ref=f3e92]
            - paragraph [ref=f3e93]: Gaussian-process BO and decomposition-based MOBO can find a good Pareto set with few evaluations because the GP prioritizes where the next call is informative, not where the search is convenient. ParEGO, in particular, sweeps trade-off directions through a Tchebycheff scalarization.
          - generic [ref=f3e94]:
            - generic [ref=f3e95]:
              - generic [ref=f3e96]: Where MOBO still hurts
              - text: With only a handful of evaluated points, the surrogate is sensitive to the initial design. The first six calls may already decide whether the optimizer sees a useful trade-off front at evaluation 30 — or wastes the early budget on regions that never recover.
            - generic [ref=f3e97]:
              - generic [ref=f3e98]: The opening-move problem
              - text: The MOBO community has refined search strategy and acquisition design in many directions, but how to seed the database with protocol-domain-valid, decision-space-diverse points — without running a separate warm-start optimizer — has been an open question.
      - generic [ref=f3e99]: Budget pressure
