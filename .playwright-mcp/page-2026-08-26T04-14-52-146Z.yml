        - generic [ref=f5e110]: Section 3 · The move that makes this paper
        - heading "An LLM knows what a battery engineer knows — and we can ask it before the surrogate has anything to say." [level=2] [ref=f5e111]
        - paragraph [ref=f5e112]: Battery knowledge is partly numerical (models, archives) and partly qualitative (typical multistage current patterns, SOC allocation heuristics, current-monotonicity rules). MOBO uses the first kind well. The second kind has been hard to feed in without a custom surrogate or a domain-specific warm-start. LLMs sit on that qualitative side naturally.
