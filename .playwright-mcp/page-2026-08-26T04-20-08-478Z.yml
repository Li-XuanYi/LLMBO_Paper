        - generic [ref=f6e222]: Section 5 · Mechanism 1 of 2
        - 'heading "LLM-informed initialization: domain text → admissible, diverse first six points." [level=2] [ref=f6e223]'
        - paragraph [ref=f6e224]: We ask the LLM for a pool of numerical protocol candidates plus a heuristic score. We then screen for admissibility, repair, rank by a soft penalty on the terminal SOC span, prefer nonincreasing current sequences, and pull a portfolio that maximizes a score-softpenalty-monotonicity-diversity objective. The rest of the six-eval budget is filled with random protocol-domain-valid points. Every selected θ is evaluated by 𝒮 before joining 𝒟.
